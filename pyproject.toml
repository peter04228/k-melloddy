[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "k-melloddy"
version = "0.1.0"
description = "Auditable, resumable PubMed collection"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6", "openpyxl>=3.1", "xlrd>=2.0", "pypdf>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
k-melloddy = "k_melloddy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"k_melloddy.db_select" = ["*.mjs"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["live: opt-in external integration; requires KMELLODDY_LIVE_SELECT=1"]

